<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Demostracion privada: no debe aparecer en buscadores. -->
    <meta name="robots" content="noindex, nofollow" />
    <title>CAFEMIN – Seguidor de Tareas</title>
    <script>
      // Marca si la página se abrió desde un enlace de recuperación de
      // contraseña. Debe leerse AQUÍ, antes de que cargue el bundle: el cliente
      // de Supabase consume y limpia el fragmento de la URL al inicializarse.
      // Flag whether the page was opened from a password-recovery link. It must
      // be read HERE, before the bundle loads: the Supabase client consumes and
      // clears the URL fragment on initialization.
      window.__cafeminRecuperacion = /(^|[#&])type=recovery(&|$)/.test(location.hash)

      // Aplica dark mode antes del primer render para evitar flash blanco
      if (localStorage.getItem('darkMode') === 'true' ||
         (!localStorage.getItem('darkMode') && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
        document.documentElement.classList.add('dark')
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
